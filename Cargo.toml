[package]
name = "thz_runtime_rs"
version = "0.4.0"
edition = "2021"
authors = ["Lucas Thomaz"]
description = "Runtime nativo de alta performance para THZ-LANG em Rust (Arena, SIMD, Crypto, LLM On-Device)"

[lib]
name = "thz_runtime"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
libc = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
